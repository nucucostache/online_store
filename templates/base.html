{% load static %}  

{% comment %} Incarca tot ce este static (imagini, videoclipuri, etc.)  {% endcomment %}

<!DOCTYPE html>
<html>
  <head>
    <title>ONLINE STORE (MAGAZIN ONLINE)</title>
    {% comment %} <link rel="stylesheet" href="{% static '../static/base.css' %}" />
    <link rel="stylesheet" href="{% static '../static/main_page.css' %}" /> {% endcomment %}
  </head>
  <body>
    <div id="app">
      <header class="navbar">
        <span class="navbar__title"> This is the Online Store! </span>     
      </header>
      
      <div class="content">{% block content %} {% endblock %}</div>
    </div>
    <script>
      const elements = document.getElementsByTagName('body')
      body = elements[0]
      function handleCM(event) {
        event.preventDefault()
      }
      body.addEventListener("contextmenu", handleCM)
    </script>
  </body>
</html>
